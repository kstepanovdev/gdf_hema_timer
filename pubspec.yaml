name: gdf_hema_timer
description: "Timer with time and score controls for HEMA"
publish_to: "none"

version: 1.1.23+1123

environment:
  sdk: ^3.9.2

dependencies:
  vibration: ^3.1.4
  shared_preferences: ^2.5.3
  audioplayers: ^6.1.0
  intl: any
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  wakelock_plus: ^1.8.2
  clock: ^1.1.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  wakelock_plus_platform_interface: ^1.7.0
  vibration_platform_interface: ^0.1.2
  audioplayers_platform_interface: ^7.2.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/bruh.mp3
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
    # Condensed font for the Ukrainian UI (OFL, see PTSansNarrow-OFL.txt).
    - family: PTSansNarrow
      fonts:
        - asset: assets/fonts/PTSansNarrow-Regular.ttf
        - asset: assets/fonts/PTSansNarrow-Bold.ttf
          weight: 700
